<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" width="1160" height="660" font-family="'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="Architecture of the AiESL open ESL middleware: retail systems on top connect through a standard API to a business layer, data layer and device layer, which drive several electronic shelf label brands, gateways and sensors over open MQTT">
  <rect width="1160" height="660" fill="#ffffff"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#12151c">One open middleware between your systems and every shelf device</text>
  <text x="40" y="70" font-size="13.5" fill="#5b6472">Connect once to the middleware; it handles each label brand, gateway and sensor underneath.</text>

  <!-- top: retail systems -->
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="96" width="1080" height="84" rx="12" fill="#f4f6fa" stroke="#dde2ea"/>
    <text x="64" y="120" font-size="12" fill="#5b6472" text-anchor="start" font-weight="700">YOUR SYSTEMS</text>
    <rect x="64" y="130" width="190" height="38" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="159" y="154" fill="#12151c">ERP / product master</text>
    <rect x="270" y="130" width="160" height="38" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="350" y="154" fill="#12151c">POS</text>
    <rect x="446" y="130" width="160" height="38" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="526" y="154" fill="#12151c">WMS / inventory</text>
    <rect x="622" y="130" width="230" height="38" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="737" y="154" fill="#12151c">Pricing engine / AI agents</text>
    <rect x="868" y="130" width="228" height="38" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="982" y="154" fill="#12151c">BI / data warehouse</text>
  </g>

  <!-- api arrow -->
  <g fill="#2f5fe0" font-size="12.5" font-weight="700">
    <path d="M580 184 L580 206" stroke="#2f5fe0" stroke-width="2.5"/>
    <path d="M572 200 L580 212 L588 200 Z"/>
    <text x="600" y="203">Standard API &#183; SDK (Python / Java / Go) &#183; MQTT</text>
  </g>

  <!-- middleware -->
  <rect x="40" y="218" width="1080" height="236" rx="14" fill="#eef3ff" stroke="#9db7ff" stroke-width="1.5"/>
  <text x="64" y="244" font-size="12" font-weight="700" fill="#2f5fe0">AiESL OPEN MIDDLEWARE</text>
  <g font-size="13.5">
    <rect x="64" y="256" width="1032" height="56" rx="9" fill="#ffffff" stroke="#c9d8ff"/>
    <text x="84" y="280" font-weight="700" fill="#12151c">Business layer</text>
    <text x="84" y="300" fill="#5b6472">Price-strategy engine &#183; inventory-collaboration interfaces &#183; promotion and template rules</text>
    <rect x="64" y="320" width="1032" height="56" rx="9" fill="#ffffff" stroke="#c9d8ff"/>
    <text x="84" y="344" font-weight="700" fill="#12151c">Data layer</text>
    <text x="84" y="364" fill="#5b6472">Aggregates, cleans and standardises shelf, device and sales data into one API &#8212; data lands in your stack</text>
    <rect x="64" y="384" width="1032" height="56" rx="9" fill="#ffffff" stroke="#c9d8ff"/>
    <text x="84" y="408" font-weight="700" fill="#12151c">Device layer</text>
    <text x="84" y="428" fill="#5b6472">Connection &#183; status monitoring &#183; firmware upgrades &#183; batch price changes &#8212; one adapter per label brand</text>
  </g>

  <!-- arrow down -->
  <g fill="#2f5fe0" font-size="12.5" font-weight="700">
    <path d="M580 458 L580 480" stroke="#2f5fe0" stroke-width="2.5"/>
    <path d="M572 474 L580 486 L588 474 Z"/>
    <text x="600" y="477">Each brand keeps its own radio and gateways</text>
  </g>

  <!-- devices -->
  <g font-size="13.5" text-anchor="middle">
    <rect x="40" y="492" width="1080" height="96" rx="12" fill="#f4f6fa" stroke="#dde2ea"/>
    <text x="64" y="516" font-size="12" fill="#5b6472" text-anchor="start" font-weight="700">SHELF DEVICES</text>
    <rect x="64" y="526" width="150" height="46" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="139" y="554" fill="#12151c">Label brand A</text>
    <rect x="226" y="526" width="150" height="46" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="301" y="554" fill="#12151c">Label brand B</text>
    <rect x="388" y="526" width="150" height="46" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="463" y="554" fill="#12151c">AiESL labels</text>
    <rect x="550" y="526" width="150" height="46" rx="8" fill="#ffffff" stroke="#c9d1dd"/><text x="625" y="554" fill="#12151c">Gateways</text>
    <rect x="712" y="526" width="190" height="46" rx="8" fill="#fff4e6" stroke="#f0d3a6"/><text x="807" y="554" fill="#b4700f">Cameras &amp; sensors</text>
    <rect x="914" y="526" width="182" height="46" rx="8" fill="#fff4e6" stroke="#f0d3a6"/><text x="1005" y="554" fill="#b4700f">Future device types</text>
  </g>

  <text x="40" y="622" font-size="12.5" fill="#5b6472">Deploy as a managed cloud service, on your own servers, or integrate the protocol and SDK into your own platform.</text>
  <text x="40" y="644" font-size="11.5" fill="#8a93a2">Schematic &#8212; not to scale. AiESL Research.</text>
</svg>
